<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EngInquire 225 Midterm</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#070709;--cyan:#22D3EE;--cyan-glow:rgba(34,211,238,.5);--violet:#7C5CFF;--green:#3DDC84;--white:#FAF8F5;--grey:#B4AFC4;--grey-dim:#7A7690;--hair:#282433;--font:'Inter',sans-serif;--display:'Space Grotesk','Inter',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:var(--white);font-family:var(--font);overflow:hidden;}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:4vh 4vw 8vh;}
.slide{display:none;width:100%;max-width:1200px;max-height:92vh;overflow-y:auto;}
.slide.on{display:block;animation:in .45s cubic-bezier(.2,.7,.2,1);}
@keyframes in{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
.slide::-webkit-scrollbar{width:7px;}.slide::-webkit-scrollbar-thumb{background:var(--hair);border-radius:99px;}
.kick{font-family:var(--display);font-size:.9rem;letter-spacing:.28em;text-transform:uppercase;color:var(--cyan);font-weight:700;margin-bottom:18px;}
h1{font-family:var(--display);font-size:clamp(2.4rem,6vw,4rem);font-weight:700;letter-spacing:-.03em;line-height:1.04;margin-bottom:22px;}
h1 .c{color:var(--cyan);text-shadow:0 0 30px var(--cyan-glow);}
p.lead{font-size:clamp(1.15rem,2.4vw,1.5rem);color:var(--grey);line-height:1.6;max-width:900px;margin-bottom:16px;}
p.lead b{color:var(--white);font-weight:600;}
.hint{font-size:1rem;color:var(--grey-dim);margin-top:16px;}
.pill{display:inline-block;font-family:var(--display);font-size:.85rem;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);border:1px solid var(--cyan);box-shadow:0 0 20px var(--cyan-glow);border-radius:99px;padding:8px 16px;margin-bottom:20px;font-weight:700;}
h2{font-family:var(--display);font-size:clamp(1.7rem,4vw,2.6rem);font-weight:700;letter-spacing:-.02em;margin-bottom:16px;}
.imgwrap{text-align:center;margin-top:12px;}
.imgwrap img{width:100%;max-width:980px;background:#fff;border-radius:16px;padding:16px;border:1px solid var(--hair);}
.reveal-btn{font-family:var(--display);font-weight:700;font-size:1.1rem;background:var(--violet);color:#fff;border:none;padding:15px 26px;border-radius:12px;cursor:pointer;transition:transform .12s;letter-spacing:-.01em;margin-top:18px;}
.reveal-btn:active{transform:scale(.97);}
.solution{margin-top:18px;padding:20px 24px;background:#111114;border-left:3px solid var(--green);border-radius:0 12px 12px 0;font-size:1.3rem;line-height:1.7;color:#D8D4E4;display:none;}
.solution.show{display:block;animation:fade .3s;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;}}
.solution .lbl{font-family:var(--display);font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--green);font-weight:700;display:block;margin-bottom:10px;}
.solution b{color:var(--white);font-weight:700;font-size:1.5rem;}
#nav{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:14px 22px;z-index:20;background:linear-gradient(0deg,var(--bg),transparent);}
.arrow{background:rgba(17,17,20,.85);border:1px solid var(--hair);color:var(--white);width:50px;height:50px;border-radius:50%;font-size:1.3rem;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.arrow:disabled{opacity:.22;cursor:default;}
#dots{display:flex;gap:8px;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--hair);cursor:pointer;transition:.25s;}
.dot.on{background:var(--cyan);width:24px;border-radius:99px;box-shadow:0 0 10px var(--cyan-glow);}
#pnum{position:fixed;top:16px;right:20px;font-size:.85rem;color:var(--grey-dim);z-index:20;}
.brand{position:fixed;top:16px;left:20px;font-family:var(--display);font-size:.8rem;letter-spacing:.22em;color:var(--grey-dim);font-weight:700;z-index:20;}
.brand b{color:var(--cyan);}
.hero-pulse{position:relative;width:100%;max-width:860px;height:200px;margin:0 0 20px;}
.hero-pulse svg{width:100%;height:100%;overflow:visible;}
.grid-ln{stroke:var(--hair);stroke-width:1;opacity:.35;}
.wave-base{fill:none;stroke:var(--hair);stroke-width:2;opacity:.5;}
.wave-live{fill:none;stroke:var(--cyan);stroke-width:4;filter:drop-shadow(0 0 14px var(--cyan));stroke-dasharray:1700;stroke-dashoffset:1700;animation:trace 2.4s cubic-bezier(.4,0,.2,1) infinite;}
.wave-live2{fill:none;stroke:var(--violet);stroke-width:3;opacity:.8;filter:drop-shadow(0 0 12px rgba(124,92,255,.7));stroke-dasharray:1700;stroke-dashoffset:1700;animation:trace 2.4s cubic-bezier(.4,0,.2,1) infinite .4s;}
.wave-live3{fill:none;stroke:var(--green);stroke-width:2;opacity:.55;filter:drop-shadow(0 0 10px rgba(61,220,132,.6));stroke-dasharray:1700;stroke-dashoffset:1700;animation:trace 2.4s cubic-bezier(.4,0,.2,1) infinite .8s;}
@keyframes trace{0%{stroke-dashoffset:1700;}50%{stroke-dashoffset:0;}100%{stroke-dashoffset:-1700;}}
.spark{fill:#fff;filter:drop-shadow(0 0 8px #fff) drop-shadow(0 0 16px var(--cyan));}
.bolt{fill:none;stroke:#fff;stroke-width:3;stroke-linejoin:round;filter:drop-shadow(0 0 10px var(--cyan)) drop-shadow(0 0 22px var(--cyan));opacity:0;animation:strike 3.4s steps(1) infinite;}
.bolt2{fill:none;stroke:var(--cyan);stroke-width:7;stroke-linejoin:round;opacity:0;filter:blur(3px);animation:strike 3.4s steps(1) infinite;}
@keyframes strike{0%,100%{opacity:0;}2%{opacity:1;}5%{opacity:.2;}7%{opacity:.9;}11%{opacity:0;}}
.flash{fill:var(--cyan);opacity:0;animation:flash 3.4s steps(1) infinite;mix-blend-mode:screen;}
@keyframes flash{0%,100%{opacity:0;}2%{opacity:.14;}6%{opacity:0;}8%{opacity:.1;}11%{opacity:0;}}
.pt{fill:var(--cyan);opacity:0;}
@keyframes rise{0%{transform:translateY(0);opacity:0;}20%{opacity:.9;}100%{transform:translateY(-120px);opacity:0;}}
h1 .c{background:linear-gradient(90deg,var(--cyan),var(--violet),var(--cyan));background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 4s linear infinite;filter:drop-shadow(0 0 24px var(--cyan-glow));}
@keyframes shine{to{background-position:200% center;}}
.zap{display:inline-block;animation:flick 2.2s ease-in-out infinite;}
@keyframes flick{0%,100%{opacity:1;filter:drop-shadow(0 0 8px var(--cyan));}48%{opacity:.6;}50%{opacity:1;filter:drop-shadow(0 0 20px var(--cyan));}52%{opacity:.5;}}
</style></head>

const BOLT="M430,8 L410,78 L448,78 L420,192 L478,92 L440,92 L470,8 Z";
let grid='';
for(let x=0;x<=860;x+=43)grid+=`<line class="grid-ln" x1="${x}" y1="0" x2="${x}" y2="200"/>`;
for(let y=0;y<=200;y+=40)grid+=`<line class="grid-ln" x1="0" y1="${y}" x2="860" y2="${y}"/>`;
let parts='';

const stage=document.getElementById('stage');
S.forEach(h=>{const d=document.createElement('div');d.className='slide';d.innerHTML=h;stage.appendChild(d);});
const sl=[...document.querySelectorAll('.slide')],dw=document.getElementById('dots');
sl.forEach((_,i)=>{const d=document.createElement('div');d.className='dot';d.onclick=()=>go(i);dw.appendChild(d);});
const dt=[...document.querySelectorAll('.dot')];let c=0;
function go(i){if(i<0||i>=sl.length)return;sl[c].classList.remove('on');dt[c].classList.remove('on');c=i;sl[c].classList.add('on');dt[c].classList.add('on');sl[c].scrollTop=0;document.getElementById('pnum').textContent=(i+1)+' / '+sl.length;document.getElementById('prev').disabled=(i===0);document.getElementById('next').disabled=(i===sl.length-1);}
document.getElementById('prev').onclick=()=>go(c-1);document.getElementById('next').onclick=()=>go(c+1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(c+1);if(e.key==='ArrowLeft')go(c-1);});

document.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50){d<0?go(c+1):go(c-1);}},{passive:1});
