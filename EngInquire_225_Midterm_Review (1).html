<title>EngInquire 225 Midterm</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#070709;--cyan:#22D3EE;--cyan-glow:rgba(34,211,238,.5);--violet:#7C5CFF;--white:#FAF8F5;--grey:#B4AFC4;--grey-dim:#7A7690;--hair:#282433;--font:'Inter',sans-serif;--display:'Space Grotesk','Inter',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:var(--white);font-family:var(--font);overflow:hidden;}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:5vh 5vw 9vh;}
.slide{display:none;width:100%;max-width:1000px;max-height:90vh;overflow-y:auto;}
.slide.on{display:block;animation:in .45s cubic-bezier(.2,.7,.2,1);}
@keyframes in{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
.kick{font-family:var(--display);font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;color:var(--cyan);font-weight:700;margin-bottom:16px;}
h1{font-family:var(--display);font-size:clamp(1.9rem,5.5vw,3.4rem);font-weight:700;letter-spacing:-.03em;line-height:1.04;margin-bottom:18px;}
h1 .c{color:var(--cyan);text-shadow:0 0 30px var(--cyan-glow);}
p.lead{font-size:clamp(.98rem,2vw,1.18rem);color:var(--grey);line-height:1.6;max-width:720px;margin-bottom:14px;}
p.lead b{color:var(--white);font-weight:600;}
.hint{font-size:.82rem;color:var(--grey-dim);margin-top:14px;}
.pill{display:inline-block;font-family:var(--display);font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);border:1px solid var(--cyan);box-shadow:0 0 20px var(--cyan-glow);border-radius:99px;padding:6px 13px;margin-bottom:18px;font-weight:700;}
h2{font-family:var(--display);font-size:clamp(1.3rem,3.4vw,2rem);font-weight:700;letter-spacing:-.02em;margin-bottom:14px;}
.imgwrap{text-align:center;margin-top:10px;}
.imgwrap img{width:100%;max-width:640px;background:#fff;border-radius:14px;padding:12px;border:1px solid var(--hair);}
#nav{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;z-index:20;background:linear-gradient(0deg,var(--bg),transparent);}
.arrow{background:rgba(17,17,20,.85);border:1px solid var(--hair);color:var(--white);width:44px;height:44px;border-radius:50%;font-size:1.15rem;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.arrow:disabled{opacity:.22;cursor:default;}
#dots{display:flex;gap:6px;}
.dot{width:6px;height:6px;border-radius:50%;background:var(--hair);cursor:pointer;transition:.25s;}
.dot.on{background:var(--cyan);width:20px;border-radius:99px;box-shadow:0 0 10px var(--cyan-glow);}
#pnum{position:fixed;top:14px;right:18px;font-size:.72rem;color:var(--grey-dim);z-index:20;}
.brand{position:fixed;top:14px;left:18px;font-family:var(--display);font-size:.68rem;letter-spacing:.22em;color:var(--grey-dim);font-weight:700;z-index:20;}
.brand b{color:var(--cyan);}
</style></head>

const stage=document.getElementById('stage');
S.forEach((h,i)=>{const d=document.createElement('div');d.className='slide';d.innerHTML=h;stage.appendChild(d);});
const sl=[...document.querySelectorAll('.slide')],dw=document.getElementById('dots');
sl.forEach((_,i)=>{const d=document.createElement('div');d.className='dot';d.onclick=()=>go(i);dw.appendChild(d);});
const dt=[...document.querySelectorAll('.dot')];let c=0;
function go(i){if(i<0||i>=sl.length)return;sl[c].classList.remove('on');dt[c].classList.remove('on');c=i;sl[c].classList.add('on');dt[c].classList.add('on');sl[c].scrollTop=0;document.getElementById('pnum').textContent=(i+1)+' / '+sl.length;document.getElementById('prev').disabled=(i===0);document.getElementById('next').disabled=(i===sl.length-1);}
document.getElementById('prev').onclick=()=>go(c-1);document.getElementById('next').onclick=()=>go(c+1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(c+1);if(e.key==='ArrowLeft')go(c-1);});
let tx=0;document.addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:1});
document.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50){d<0?go(c+1):go(c-1);}},{passive:1});
go(0);
</script></body></html>
